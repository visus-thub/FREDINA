<meta name="theme-color" content="#1c1514">
<style>
:root{--bg:#1c1514;--c1:#2a1e1d;--c2:#33261f;--in:#150f0e;--ln:#3d2e2c;--tx:#f5ece6;--mu:#bfa9a0;--bt:#fff;--vi:#D81F58;--pk:#FF7BA3;--go:#D4A373;--dg:#5a2326;--ac:#FF4D86;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=sombre]{--bg:#0f1013;--c1:#1a1b21;--c2:#23252d;--in:#0a0b0e;--ln:#30323b;--tx:#eceef4;--mu:#9aa0b0;--bt:#fff;--vi:#5b5fe0;--pk:#a855f7;--go:#f5c451;--dg:#4a1d27;--ac:#8b8ff5;color-scheme:dark}
:root[data-theme=bleu]{--bg:#0a1424;--c1:#11213a;--c2:#172a4a;--in:#07101d;--ln:#243a5e;--tx:#e8f0ff;--mu:#9fb3d1;--bt:#fff;--vi:#2563eb;--pk:#38bdf8;--go:#fbbf24;--dg:#4a1d2a;--ac:#5aa9ff;color-scheme:dark}
:root[data-theme=vert]{--bg:#0a1a14;--c1:#112a20;--c2:#183828;--in:#07130f;--ln:#25453a;--tx:#e9f8ef;--mu:#9ec2b0;--bt:#fff;--vi:#15803d;--pk:#34d399;--go:#facc15;--dg:#4a1d27;--ac:#3ddc97;color-scheme:dark}
:root[data-theme=clair]{--bg:#FBF3EC;--c1:#ffffff;--c2:#f1e4da;--in:#fff8f2;--ln:#e3d0c5;--tx:#2B1119;--mu:#7d5a66;--bt:#2B1119;--vi:#D81F58;--pk:#E8587F;--go:#B7791F;--dg:#f8d7dd;--ac:#D81F58;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,var(--c1),var(--bg) 40%,var(--in));background-color:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
button,input,textarea{font:inherit}button{border:0;cursor:pointer;color:var(--bt)}
.app{max-width:1100px;margin:auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.logo{font-weight:900;letter-spacing:2px;font-size:22px}.logo span{color:var(--go)}
.pill{padding:6px 10px;border:1px solid var(--ln);border-radius:99px;font-size:12px;color:var(--tx)}
.screen{display:none}.screen.active{display:block}
.card{background:linear-gradient(145deg,var(--c1),var(--bg));border:1px solid var(--ln);border-radius:20px}
.setup,.final{max-width:700px;margin:3vh auto;padding:22px}
h1{font-size:clamp(34px,9vw,64px);line-height:.95;margin:6px 0 12px}h2{margin:4px 0 10px}p{color:var(--mu);line-height:1.5}
.small{font-size:12px;color:var(--mu)}
.primary,.secondary,.danger,.choice{padding:12px 16px;border-radius:12px;font-weight:700}
.primary{background:linear-gradient(135deg,var(--vi),var(--pk))}.secondary{background:var(--c2);border:1px solid var(--ln)}.danger{background:var(--dg)}
.choice{display:block;width:100%;text-align:left;margin:8px 0;background:var(--c1);border:1px solid var(--ln)}
.row{display:flex;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.on{outline:2px solid var(--vi)}
input[type=text],textarea{background:var(--in);border:1px solid var(--ln);color:var(--tx);padding:12px;border-radius:12px;width:100%}
.answer{min-height:90px;resize:vertical}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.gg{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px}
.bw{padding:10px}
.board{position:relative;display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);gap:2px;aspect-ratio:1;width:100%;max-width:760px;margin:0 auto;border-radius:16px;background:#FDFBF7;box-shadow:0 0 0 4px var(--go),0 0 0 6px var(--vi)}
.cell{position:relative;background:#fff;border:1px solid #e3d3c0;border-radius:5px;color:#2e2020;display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0}
.cell::before{content:"";position:absolute;top:0;left:0;right:0;height:24%;background:var(--c,var(--go))}
.cell .t{font-size:clamp(11px,2.7vw,21px);line-height:1;margin-top:20%}
.cell .n{position:absolute;bottom:1px;right:3px;font-size:clamp(6px,1.3vw,9px);color:#8a7568;font-family:Georgia,serif}
.cell.cr{background:var(--vi);color:#fff;box-shadow:inset 0 0 0 2px var(--go)}.cell.cr .n{color:#f1d9bf}
.ty-s,.ty-b,.ty-e{--c:var(--go)}.ty-h{--c:var(--vi)}.ty-d{--c:#6b4e71}.ty-f{--c:#E0A458}.ty-g{--c:#5d8a82}.ty-c{--c:#c0617a}.ty-k{--c:#7c6f64}.ty-r{--c:#b07d62}.ty-x{--c:#8a8f98}.ty-t{--c:#3a2020}.ty-p{--c:#e0b341}.ty-y{--c:#7a5c3b}
.ctr{grid-area:2/2/11/11;border-radius:12px;background:linear-gradient(160deg,var(--vi),#6e2f31);color:#FDFBF7;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:6px}
.ctr img{width:32%;max-width:110px;border-radius:22%}
.ctr b{font-family:Georgia,serif;font-size:clamp(16px,4.5vw,28px);letter-spacing:.14em}
.ctr span{font-size:clamp(9px,2.3vw,13px);color:#f1d9bf;max-width:88%}
.board .tok{position:absolute;width:4.2%;min-width:14px;aspect-ratio:1;transform:translate(-50%,-50%);transition:left .17s linear,top .17s linear;z-index:3;box-shadow:0 2px 5px #0007;font-size:clamp(7px,1.6vw,11px)}
.tok{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:9px;font-weight:900;border:2px solid #fff}
.k0{background:#ef4444}.k1{background:#3b82f6}.k2{background:#22c55e}.k3{background:#f59e0b;color:#111}
.side{padding:12px}.turn{padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--ln);margin-bottom:10px}
.sl{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
.ev{margin-top:10px;padding:12px;border-radius:14px;background:var(--in);border:1px solid var(--ln)}
.ev h3{margin:0 0 6px}.story{max-height:200px;overflow:auto}.story p{margin:6px 0;padding-bottom:6px;border-bottom:1px solid var(--ln);font-size:13px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.modal{position:fixed;inset:0;background:rgba(2,3,9,.82);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}.mb{max-width:620px;width:100%;padding:20px;max-height:92vh;overflow:auto}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--go),var(--pk))}
.rank{display:flex;justify-content:space-between;padding:12px;margin:6px 0;background:var(--in);border:1px solid var(--ln);border-radius:12px}
@media(max-width:850px){.gg{grid-template-columns:1fr}}
.pg{display:flex;align-items:center;gap:8px;margin:4px 0;font-size:11px}.pb{flex:1;height:8px;background:var(--ln);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--vi),var(--go))}.pgw{margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--ln)}#pstrip{margin-bottom:8px}

h1,h2,h3{font-family:Caveat,"Segoe Print","Bradley Hand",cursive}h2{font-size:1.9rem;line-height:1.15}h3{font-size:1.5rem}
.hand{font-family:Caveat,"Segoe Print","Bradley Hand",cursive}.mark{font-family:"Permanent Marker","Marker Felt",Caveat,cursive}
.primary,.danger{color:#fff}.tok:not(.k3){color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.hl,.hr{display:flex;align-items:center;gap:8px}.hi{font-size:1.6rem;color:var(--ac);line-height:1.1}
.flg{display:flex;flex-direction:column;align-items:flex-end;line-height:1}.flg svg{width:46px;height:auto}.flg b{font-size:1rem;letter-spacing:.06em;margin-top:-2px}
.sw{display:inline-block;width:18px;height:18px;border-radius:50%;vertical-align:middle;margin-right:10px;border:2px solid var(--tx)}
#login{position:fixed;inset:0;z-index:30;background:#170a10;transition:opacity .5s}
#login.out{opacity:0;pointer-events:none}
#bgb{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(26px) brightness(.5)}
#pg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center top}
.ctl{position:absolute;left:0;right:0;bottom:0;max-width:420px;margin:0 auto;padding:16px 22px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;text-align:center}
.ctl input{width:100%;padding:10px 6px;background:transparent;border:0;border-bottom:2px solid rgba(255,255,255,.85);border-radius:0;color:#fff;font:700 1.6rem Caveat,cursive;text-align:center;text-shadow:0 1px 6px #000}
.ctl input::placeholder{color:rgba(255,255,255,.85)}
.ghost{padding:12px 18px;border-radius:99px;background:rgba(255,255,255,.03);border:2px solid #fff;color:#fff;font:700 1.15rem Caveat,cursive;letter-spacing:.04em;text-shadow:0 1px 6px #000;box-shadow:0 0 14px #0006}
.lnk{background:none;color:#fff;font-size:.85rem;text-decoration:underline;text-shadow:0 1px 5px #000;padding:4px}
#hint{min-height:1.2em;color:#fff;font-size:.9rem;text-shadow:0 1px 5px #000}
#adm{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:8px;background:none;color:#fff;opacity:.55;font-size:.8rem;margin:0!important}
.paper{position:relative;background:#F7EFE6;color:#2B1119;border-radius:4px 16px 6px 16px;padding:20px;box-shadow:0 10px 28px rgba(0,0,0,.25)}
.paper::before{content:"";position:absolute;top:-9px;left:22px;width:72px;height:20px;background:var(--vi);opacity:.8;transform:rotate(-4deg)}
.paper p,.paper small{color:inherit}
.hh{font-size:2.4rem;line-height:1.05;color:var(--ac);margin:10px 0 6px;font-weight:700}
.tiles{display:grid;gap:16px;margin:22px 0 8px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.tile{display:block;width:100%;text-align:left;font:inherit;color:#2B1119}.tile b{display:block;font-size:2rem;line-height:1.1}.tile small{font-size:.92rem;opacity:.85}
.tile.hot{background:var(--vi);color:#fff}.tile.hot::before{background:var(--go)}
.ttl{font-size:2.2rem;color:var(--ac);line-height:1}
.chips{display:flex;gap:8px;margin:12px 0 4px;flex-wrap:wrap}
.chip{padding:7px 16px;border-radius:99px;border:1.5px solid var(--vi);background:none;color:var(--tx);font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--vi);color:#fff;font-weight:700}
.stage{display:flex;flex-direction:column;justify-content:center;padding:18px 0;min-height:270px;max-width:520px;margin:0 auto}
.dk{min-height:230px;display:flex;flex-direction:column;justify-content:space-between;padding:30px 24px;animation:pop .35s ease}
.dk.hot{background:var(--vi);color:#fff}.dk.hot::before{background:var(--go)}
@keyframes pop{from{opacity:0;transform:translateY(12px) rotate(-1deg)}to{opacity:1;transform:rotate(-.5deg)}}
@media (prefers-reduced-motion:reduce){.dk{animation:none}}
